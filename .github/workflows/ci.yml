# Build and test on Linux and Windows (NFR-011). Runs once the GitHub remote exists.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore PhotoX.slnx
      - run: dotnet build PhotoX.slnx -c Release --no-restore
      - run: dotnet test PhotoX.slnx -c Release --no-build

  windows-package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: dotnet tool restore
      - run: dotnet publish src/PhotoX.App -c Release -r win-x64 --self-contained -p:DebugType=None -p:DebugSymbols=false -o publish/win-x64
      # The installer and portable zip carry the version in their names (prompt_04 §1). The installer shows a splash
      # with the name and version while it installs; it installs per user into %LOCALAPPDATA%\PhotoX with Start menu
      # and desktop shortcuts and an entry in Installed apps; a newer installer updates in place (prompt_06 §8).
      - shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          python packaging/windows/make_splash.py $version releases/splash.png
          dotnet vpk pack --packId PhotoX --packVersion $version --packDir publish/win-x64 --mainExe PhotoX.exe --icon assets/logo/photox.ico --packTitle PhotoX --packAuthors PhotoX --splashImage releases/splash.png --shortcuts StartMenuRoot,Desktop --outputDir releases/win
          Rename-Item releases/win/PhotoX-win-Setup.exe "PhotoX-$version-win-Setup.exe"
          Rename-Item releases/win/PhotoX-win-Portable.zip "PhotoX-$version-win-Portable.zip"
          "PHOTOX_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoX-${{ env.PHOTOX_VERSION }}-windows
          path: releases/win
